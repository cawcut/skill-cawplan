name: Validate Skills

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Frontmatter, version sync, and references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix cli

      - name: Validate skills
        run: bash scripts/validate-skills.sh

      - name: Test public content audit
        run: python3 -m unittest discover -s scripts/tests -p "test_public_content_audit.py"

      - name: Audit public content (tracked files and complete fetched history)
        run: |
          python3 scripts/audit-public-content.py
          python3 scripts/audit-public-content.py --history

      - name: Scan secrets in Git history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool_dir="$RUNNER_TEMP/public-content-gitleaks"
          mkdir -p "$tool_dir"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$tool_dir"
          cd "$tool_dir"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts="--all --full-history" --redact --ignore-gitleaks-allow --no-banner
